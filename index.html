<body>

    <!-- Header (User Site) -->
    <header>
        <div class="logo">

        <div class="search-bar">
            <input type="text" placeholder="Search videos...">
            <button>🔍</button>

    </header>

    <!-- Video Grid Container -->
    <div class="video-grid" id="videoGrid">
        
        <!-- =========================================
        এখান থেকে ভিডিও কার্ড শুরু। 
        নতুন ভিডিও যোগ করতে নিচের কার্ডটি কপি করে পেস্ট করুন।
        ========================================= -->

        <!-- Video Card 1 -->
        <div class="video-card" onclick="playVideo('https://videotourl.com/videos/1791053680795-7f24adf9-06a0-4dae-9655-338c6eab7a34.mp4', 'My First Video', 'My Channel', 'https://videotourl.com/videos/1791053680795-7f24adf9-06a0-4dae-9655-338c6eab7a34.mp4')">
            <div class="thumbnail-container">
                <!-- এখানে আপনার পছন্দমতো থাম্বনেইল ছবির লিংক বসাতে পারেন -->
                <img src="https://i.postimg.cc/sgvpFhxX/Screenshot-2026-10-04-005701.png" alt="Thumb">
            </div>
            <div class="video-info">
                <div class="video-title">My First Video</div>
                <div class="channel-name">My Channel</div>
            </div>
        </div>

        <!-- Video Card 2 -->
        <div class="video-card" onclick="playVideo('https://videotourl.com/videos/1791053680795-7f24adf9-06a0-4dae-9655-338c6eab7a34.mp4', 'My Second Video', 'My Channel', 'https://videotourl.com/videos/1791053680795-7f24adf9-06a0-4dae-9655-338c6eab7a34.mp4')">
            <div class="thumbnail-container">
                <img src="https://via.placeholder.com/640x360/333/fff?text=Video+2" alt="Thumb">
            </div>
            <div class="video-info">

            </div>

        <!-- =========================================

    <!-- Video Player Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeVideo()">&times;</span>
            <video id="modalVideo" controls autoplay></video>
            
            <!-- Download Section -->
            <div class="download-section">
                <h3 id="modalTitle" style="margin-bottom: 5px;">Video Title</h3>
                <p id="modalChannel" style="color: #aaa; font-size: 14px; margin-bottom: 10px;">Channel Name</p>
                
                <!-- Download Button -->
                <button class="download-btn" id="downloadBtn" onclick="startDownloadTimer()">
                    ⬇️ Download Video
                </button>

                <!-- Timer & Link Area -->
                <div class="timer-popup" id="timerPopup">
                    <div class="timer-text" id="timerText">Please wait 20 seconds...</div>
                    <a href="#" class="download-link" id="downloadLink" target="_blank">Click Here to Download</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // বর্তমান ভিডিওর ডাউনলোড লিংক রাখার জন্য ভেরিয়েবল
        let currentDownloadLink = '';

        // ভিডিও প্লে করার ফাংশন (৪টি প্যারামিটার নেয়: link, title, channel, downloadLink)
        function playVideo(link, title, channel, downloadLink) {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            const modalTitle = document.getElementById('modalTitle');
            const modalChannel = document.getElementById('modalChannel');

            // ডাউনলোড সেকশন রিসেট করা
            currentDownloadLink = downloadLink || link; 
            document.getElementById('downloadBtn').style.display = 'flex';
            document.getElementById('timerPopup').style.display = 'none';
            document.getElementById('downloadLink').style.display = 'none';
            document.getElementById('downloadLink').href = '#';
            document.getElementById('timerText').innerText = 'Please wait 20 seconds...';

            // YouTube লিংক চেক করা
            if (link.includes('youtube.com') || link.includes('youtu.be')) {
                let videoId = '';
                if (link.includes('youtu.be/')) {
                    videoId = link.split('youtu.be/')[1].split('?')[0];
                } else if (link.includes('watch?v=')) {
                    videoId = link.split('watch?v=')[1].split('&')[0];
                }
                video.src = `https://youtu.be/mUyXUdJUuM8?si=p3dHr8V7fapSLL6X`;
            } else {
                // ডাইরেক্ট ভিডিও লিংক
                video.src = link;
            }

            // এরর হ্যান্ডেলিং
            video.onerror = function() {
                alert("দুঃখিত, ভিডিওটি লোড করা যাচ্ছে না। লিংকটি চেক করে আবার চেষ্টা করুন।");
                console.log("Video Error: লিংকটি ভুল অথবা সার্ভার ডাউন।");
            };

            modalTitle.innerText = title;
            modalChannel.innerText = channel;
            modal.style.display = 'flex';
            
            // ভিডিও লোড এবং প্লে করার চেষ্টা
            video.load(); 
            video.play().catch(error => {
                console.log("Autoplay blocked or video failed to load:", error);
            });
        }

        // ভিডিও বন্ধ করার ফাংশন
        function closeVideo() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            video.pause();
            video.currentTime = 0;
            video.src = ''; 
            modal.style.display = 'none';
        }

        // ২০ সেকেন্ডের টাইমার শুরু করার ফাংশন
        function startDownloadTimer() {
            const downloadBtn = document.getElementById('downloadBtn');
            const timerPopup = document.getElementById('timerPopup');
            const timerText = document.getElementById('timerText');
            const downloadLink = document.getElementById('downloadLink');

            // বাটন লুকানো এবং টাইমার দেখানো
            downloadBtn.style.display = 'none';
            timerPopup.style.display = 'block';

            let timeLeft = 20;

            // প্রতি ১ সেকেন্ড পর পর টাইমার আপডেট
            const interval = setInterval(() => {
                timeLeft--;
                timerText.innerText = `Please wait ${timeLeft} seconds...`;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerText.innerText = 'Your download is ready!';
                    
                    // ডাউনলোড লিংক সেট করা এবং দেখানো
                    downloadLink.href = currentDownloadLink;
                    downloadLink.style.display = 'inline-block';
                }
            }, 1000);
        }
    </script>
